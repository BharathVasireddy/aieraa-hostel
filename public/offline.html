<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Aieraa Hostel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #059669, #10b981);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            position: relative;
        }
        
        .icon::before {
            content: '📶';
            font-size: 36px;
            transform: rotate(180deg);
            opacity: 0.8;
        }
        
        .icon::after {
            content: '❌';
            font-size: 20px;
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #ef4444;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid white;
        }
        
        h1 {
            color: #111827;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        
        .features {
            text-align: left;
            margin-bottom: 32px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            color: #374151;
            font-size: 14px;
        }
        
        .feature-icon {
            width: 32px;
            height: 32px;
            background: #f3f4f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
        }
        
        .button {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }
        
        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .link {
            color: #059669;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .status {
            margin-top: 24px;
            padding: 16px;
            background: #fef3c7;
            border-radius: 12px;
            border-left: 4px solid #f59e0b;
        }
        
        .status-text {
            color: #92400e;
            font-size: 14px;
            font-weight: 500;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon pulse"></div>
        
        <h1>You're Offline</h1>
        <p class="subtitle">
            No internet connection detected. Don't worry, some features are still available!
        </p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📱</div>
                <span>Browse previously viewed pages</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🍽️</div>
                <span>View cached menu items</span>
            </div>
            <div class="feature">
                <div class="feature-icon">📋</div>
                <span>Check your recent orders</span>
            </div>
        </div>
        
        <button class="button" onclick="tryReconnect()">
            <span id="reconnect-text">Try to Reconnect</span>
        </button>
        
        <a href="/" class="link">Go to Home Page</a>
        
        <div class="status">
            <div class="status-text" id="connection-status">
                Checking connection...
            </div>
        </div>
    </div>

    <script>
        let reconnectAttempts = 0;
        const maxAttempts = 3;
        
        function updateConnectionStatus() {
            const statusEl = document.getElementById('connection-status');
            
            if (navigator.onLine) {
                statusEl.textContent = '✅ Connection restored! Redirecting...';
                statusEl.style.color = '#059669';
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            } else {
                statusEl.textContent = '❌ Still offline. Please check your connection.';
            }
        }
        
        function tryReconnect() {
            const button = document.querySelector('.button');
            const buttonText = document.getElementById('reconnect-text');
            
            reconnectAttempts++;
            
            button.disabled = true;
            buttonText.textContent = 'Checking...';
            
            // Simulate connection check
            setTimeout(() => {
                if (navigator.onLine) {
                    buttonText.textContent = '✅ Connected!';
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    buttonText.textContent = reconnectAttempts >= maxAttempts 
                        ? 'Still Offline' 
                        : 'Try Again';
                    button.disabled = false;
                    
                    if (reconnectAttempts >= maxAttempts) {
                        button.style.background = '#6b7280';
                        setTimeout(() => {
                            buttonText.textContent = 'Try to Reconnect';
                            button.style.background = 'linear-gradient(135deg, #059669, #10b981)';
                            button.disabled = false;
                            reconnectAttempts = 0;
                        }, 3000);
                    }
                }
            }, 1500);
        }
        
        // Listen for online/offline events
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        
        // Initial status check
        updateConnectionStatus();
        
        // Periodic connection check
        setInterval(updateConnectionStatus, 5000);
    </script>
</body>
</html>
